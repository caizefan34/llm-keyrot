name: Bug report
description: Report incorrect behavior in key rotation, retry, or fallback
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include minimal code and exact input/output
      placeholder: |
        1. Configure KeyRotator with ...
        2. Send request ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.19.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace (redacted)
      description: Do not include full API keys or secrets
